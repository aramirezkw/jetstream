  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

adding: 0; background: var(--page); color: var(--text); font-family: var(--font); }\n  body { min-width: 1440px; min-height: 920px; overflow: hidden; }\n  button { font-family: inherit; cursor: pointer; }\n\n  .backdrop-frame {\n    position: fixed; inset: 0;\n    width: 100%; height: 100%;\n    border: 0; pointer-events: none; background: #fff;\n  }\n  .scrim {\n    position: fixed; inset: 0;\n    background: rgba(7, 18, 38, .55);\n    backdrop-filter: blur(1.5px);\n    -webkit-backdrop-filter: blur(1.5px);\n    z-index: 5;\n  }\n\n  .modal-wrap {\n    position: fixed; inset: 0;\n    display: grid; place-items: center;\n    z-index: 10; padding: 40px;\n  }\n  .modal {\n    width: 1060px;\n    background: #fff;\n    border-radius: 10px;\n    box-shadow: 0 24px 60px rgba(7,18,38,.45), 0 4px 12px rgba(7,18,38,.2);\n    overflow: hidden;\n    display: flex; flex-direction: column;\n  }\n\n  /* ── Header ── */\n  .mhead {\n    background: var(--ice-navy);\n    color: #fff;\n    padding: 20px 24px 22px;\n    position: relative;\n  }\n  .mhead-top { display: flex; align-items: center; gap: 12px; }\n  .mhead .title { font-size: 19px; font-weight: 700; letter-spacing: -.2px; }\n  .pill-tag {\n    background: rgba(255,255,255,.10);\n    border: 1px solid rgba(255,255,255,.22);\n    color: #fff;\n    border-radius: 999px;\n    padding: 4px 10px;\n    font-size: 10.5px;\n    font-weight: 600;\n    letter-spacing: .4px;\n    white-space: nowrap;\n  }\n  .pill-tag .x { opacity: .6; }\n  .mhead .sub {\n    font-size: 12.5px;\n    opacity: .8;\n    margin-top: 4px;\n    display: flex; align-items: center; gap: 8px;\n  }\n  .kw-mark {\n    background: var(--kw-red);\n    color: #fff;\n    font-size: 9px;\n    font-weight: 800;\n    letter-spacing: .4px;\n    padding: 2px 4px;\n    border-radius: 2px;\n    line-height: 1;\n  }\n  .close-btn {\n    position: absolute; top: 18px; right: 18px;\n    width: 32px; height: 32px;\n    border-radius: 999px;\n    background: rgba(255,255,255,.10);\n    border: 1px solid rgba(255,255,255,.18);\n    color: #fff;\n    display: inline-flex; align-items: center; justify-content: center;\n  }\n  .close-btn:hover { background: rgba(255,255,255,.18); }\n  .close-btn svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; }\n\n  /* ── Body: map + panel ── */\n  .mbody {\n    display: grid;\n    grid-template-columns: 1fr 360px;\n    background: #fff;\n  }\n\n  /* ── Map ── */\n  .map-wrap {\n    position: relative;\n    background: var(--map-land);\n    overflow: hidden;\n    min-height: 520px;\n  }\n  .map-wrap svg { display: block; width: 100%; height: 100%; }\n\n  .map-hint {\n    position: absolute;\n    top: 14px; left: 14px;\n    background: rgba(255,255,255,.94);\n    border: 1px solid var(--border);\n    border-radius: 6px;\n    padding: 8px 12px;\n    font-size: 11.5px;\n    color: var(--text-2);\n    font-weight: 500;\n    display: flex; align-items: center; gap: 8px;\n    box-shadow: 0 1px 3px rgba(0,0,0,.08);\n  }\n  .map-hint .dotx {\n    width: 8px; height: 8px; border-radius: 999px;\n    background: var(--ice-gold);\n  }\n\n  .map-creds {\n    position: absolute;\n    bottom: 6px; right: 8px;\n    font-size: 10px;\n    color: #6b6f78;\n    background: rgba(255,255,255,.7);\n    padding: 2px 6px;\n    border-radius: 3px;\n  }\n\n  /* Map zoom buttons (decorative) */\n  .map-ctrl {\n    position: absolute;\n    top: 14px; right: 14px;\n    display: flex; flex-direction: column;\n    background: #fff;\n    border: 1px solid var(--border);\n    border-radius: 6px;\n    overflow: hidden;\n    box-shadow: 0 1px 3px rgba(0,0,0,.08);\n  }\n  .map-ctrl button {\n    width: 30px; height: 30px;\n    border: 0; background: #fff;\n    color: var(--text);\n    font-size: 16px;\n    line-height: 1;\n    border-bottom: 1px solid var(--border);\n  }\n  .map-ctrl button:last-child { border-bottom: 0; }\n  .map-ctrl button:hover { background: var(--soft); }\n\n  /* Neighborhood polygons */\n  .nhood {\n    cursor: pointer;\n    fill: rgba(10, 45, 94, .12);\n    stroke: rgba(10, 45, 94, .55);\n    stroke-width: 1.4;\n    stroke-dasharray: 4 3;\n    transition: fill 140ms ease, stroke 140ms ease;\n  }\n  .nhood:hover {\n    fill: rgba(232, 160, 26, .28);\n    stroke: rgba(232, 160, 26, .85);\n  }\n  .nhood.selected {\n    fill: rgba(232, 160, 26, .35);\n    stroke: var(--ice-gold);\n    stroke-dasharray: none;\n    stroke-width: 2;\n  }\n  .nhood-label {\n    font: 600 11px var(--font);\n    fill: var(--ice-navy);\n    pointer-events: none;\n    text-anchor: middle;\n    paint-order: stroke;\n    stroke: rgba(255,255,255,.85);\n    stroke-width: 3;\n    stroke-linejoin: round;\n  }\n  .nhood-label.selected { fill: #fff; stroke: var(--ice-navy); stroke-width: 3; }\n\n  /* ── Info panel ── */\n  .panel {\n    border-left: 1px solid var(--border);\n    padding: 22px 22px 18px;\n    display: flex; flex-direction: column;\n    background: #fff;\n  }\n  .panel .kicker {\n    font-size: 11px;\n    letter-spacing: .14em;\n    text-transform: uppercase;\n    color: var(--text-2);\n    font-weight: 700;\n  }\n  .panel .nname {\n    font-size: 24px;\n    font-weight: 700;\n    letter-spacing: -.4px;\n    margin-top: 6px;\n  }\n  .panel .stats-row {\n    display: flex; gap: 18px;\n    margin-top: 14px;\n    padding-bottom: 16px;\n    border-bottom: 1px solid var(--border);\n  }\n  .stat { display: flex; flex-direction: column; }\n  .stat .v { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -.2px; }\n  .stat .k { font-size: 11px; color: var(--text-2); margin-top: 2px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }\n\n  .panel .descr {\n    font-size: 13px;\n    color: var(--text-2);\n    line-height: 1.5;\n    margin-top: 14px;\n  }\n\n  .panel .feat-lbl {\n    font-size: 11px;\n    text-transform: uppercase;\n    letter-spacing: .14em;\n    color: var(--text);\n    font-weight: 700;\n    margin: 18px 0 10px;\n  }\n\n  .highlights {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 8px;\n  }\n  .hl {\n    display: flex; align-items: center; gap: 10px;\n    padding: 10px 12px;\n    border: 1px solid var(--border);\n    border-radius: 8px;\n    background: #fff;\n    transition: background 140ms ease, border-color 140ms ease;\n  }\n  .hl:hover { background: var(--soft); border-color: #cdd2da; }\n  .hl .hl-ico {\n    width: 28px; height: 28px;\n    border-radius: 999px;\n    background: rgba(10, 45, 94, .08);\n    color: var(--ice-navy);\n    display: inline-flex; align-items: center; justify-content: center;\n    flex: 0 0 28px;\n  }\n  .hl .hl-ico svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }\n  .hl .hl-label { font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.25; }\n\n  .gold-cta {\n    background: var(--ice-gold);\n    color: #fff;\n    border: 0;\n    height: 44px;\n    border-radius: 6px;\n    font: 700 13px var(--font);\n    letter-spacing: .2px;\n    display: inline-flex; align-items: center; justify-content: center; gap: 8px;\n    margin-top: 16px;\n    width: 100%;\n  }\n  .gold-cta:hover { background: var(--ice-gold-hover); }\n  .gold-cta svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }\n\n  /* ── Footer ── */\n  .mfoot {\n    background: #f6f7f9;\n    border-top: 1px solid var(--border);\n    padding: 12px 24px;\n    display: flex; align-items: center; justify-content: space-between;\n    font-size: 12px;\n    color: var(--text-2);\n  }\n  .mfoot .kw-tile {\n    width: 22px; height: 22px;\n    background: var(--kw-red);\n    color: #fff;\n    border-radius: 2px;\n    font: 800 11px var(--font);\n    display: inline-flex; align-items: flex-end; justify-content: flex-start;\n    padding: 1px 2px;\n    line-height: .9;\n    letter-spacing: -.5px;\n  }\n\n<\ >\n            <text class=\"nhood-label\" x=\"330\" y=\"115\">Hyde Park<\u002Ftext>\n          <\u002Fg>\n\n          <!-- Mueller — NE -->\n          <g class=\"n-group\" data-id=\"mueller\">\n            <polygon class=\"nhood\" points=\"475,130 545,125 575,150 575,200 525,215 470,200 460,165\"><\u002Fpolygon>\n            <text class=\"nhood-label\" x=\"520\" y=\"175\">Mueller<\u002Ftext>\n          <\u002Fg>\n\n          <!-- East Austin -->\n          <g class=\"n-group\" data-id=\"east-austin\">\n            <polygon class=\"nhood\" points=\"460,225 545,225 580,250 575,290 520,300 460,295 445,265\"><\u002Fpolygon>\n            <text class=\"nhood-label\" x=\"515\" y=\"265\">East Austin<\u002Ftext>\n          <\u002Fg>\n\n          <!-- South Congress — south center -->\n          <g class=\"n-group\" data-id=\"south-congress\">\n            <polygon class=\"nhood\" points=\"345,345 415,345 445,375 430,420 375,430 325,415 320,380\"><\u002Fpolygon>\n            <text class=\"nhood-label\" x=\"385\" y=\"390\">South Congress<\u002Ftext>\n          <\u002Fg>\n\n          <!-- Zilker — south-west of lake -->\n          <g class=\"n-group\" data-id=\"zilker\">\n            <polygon class=\"nhood\" points=\"195,365 270,360 295,390 280,430 215,445 175,420 170,390\"><\u002Fpolygon>\n            <text class=\"nhood-label\" x=\"235\" y=\"405\">Zilker<\u002Ftext>\n          <\u002Fg>\n\n          <!-- Travis Heights — south, east of South Congress -->\n          <g class=\"n-group\" data-id=\"travis-heights\">\n            <polygon class=\"nhood\" points=\"465,355 540,355 565,385 545,425 480,440 450,415 445,380\"><\u002Fpolygon>\n            <text class=\"nhood-label\" x=\"505\" y=\"395\">Travis Heights<\u002Ftext>\n          <\u002Fg>\n\n          <!-- Water label -->\n          <text x=\"305\" y=\"313\" font-family=\"Inter\" font-size=\"9\" font-style=\"italic\" fill=\"#3a7090\" opacity=\".7\">Lady Bird Lake<\u002Ftext>\n        <\u002Fsvg>\n\n        <div class=\"map-h ame: \"Tarrytown\",\n      listings: \"XX\", walk: \"62\", schools: \"A\",\n      descr: \"Established west-side neighborhood near Lake Austin with mature trees, mid-century cottages, and quiet residential streets.\",\n      highlights: [\n        [\"school\",   \"Top-rated schools\"],\n        [\"lake\",     \"Lake Austin access\"],\n        [\"quiet\",    \"Quiet residential\"],\n        [\"historic\", \"Established character\"]\n      ]\n    },\n    \"downtown\": {\n      name: \"Downtown\",\n      listings: \"XX\", walk: \"96\", schools: \"B+\",\n      descr: \"High-rise condos and walkable streets along Congress Avenue, with Lady Bird Lake at the doorstep.\",\n      highlights: [\n        [\"walk\",      \"Highly walkable\"],\n        [\"nightlife\", \"Music & nightlife\"],\n        [\"dining\",    \"Restaurants nearby\"],\n        [\"transit\",   \"Transit hub\"]\n      ]\n    },\n    \"hyde-park\": {\n      name: \"Hyde Park\",\n      listings: \"XX\", walk: \"84\", schools: \"A\",\n      descr: \"Historic central neighborhood of bungalows and tree-lined streets, walking distance to UT and local coffee shops.\",\n      highlights: [\n        [\"historic\", \"Historic homes\"],\n        [\"school\",   \"Near UT campus\"],\n        [\"dining\",   \"Cafés & shops\"],\n        [\"bike\",     \"Bike-friendly\"]\n      ]\n    },\n    \"mueller\": {\n      name: \"Mueller\",\n      listings: \"XX\", walk: \"78\", schools: \"A–\",\n      descr: \"Master-planned redevelopment on the former airport site — modern homes, parks, and a weekly farmers market.\",\n      highlights: [\n        [\"new\",      \"Newer construction\"],\n        [\"park\",     \"Parks & greenways\"],\n        [\"family\",   \"Family-friendly\"],\n        [\"shopping\", \"Close to shopping\"]\n      ]\n    },\n    \"east-austin\": {\n      name: \"East Austin\",\n      listings: \"XX\", walk: \"82\", schools: \"B\",\n      descr: \"Eclectic mix of new builds and historic homes, music venues, and food trailers east of IH-35.\",\n      highlights: [\n        [\"dining\",    \"Food scene\"],\n        [\"nightlife\", \"Live music\"],\n        [\"downtown\",  \"Close to downtown\"],\n        [\"bike\",      \"Bike lanes\"]\n      ]\n    },\n    \"south-congress\": {\n      name: \"South Congress\",\n      listings: \"XX\", walk: \"88\", schools: \"B+\",\n      descr: \"Iconic SoCo strip lined with boutiques, music venues, and 1920s bungalows — minutes south of downtown.\",\n      highlights: [\n        [\"shopping\",  \"Boutique shopping\"],\n        [\"dining\",    \"Iconic restaurants\"],\n        [\"walk\",      \"Walk to Congress\"],\n        [\"downtown\",  \"5 min to downtown\"]\n      ]\n    },\n    \"zilker\": {\n      name: \"Zilker\",\n      listings: \"XX\", walk: \"74\", schools: \"A\",\n      descr: \"Adjacent to Zilker Park and Barton Springs — leafy streets, modern remodels, and easy lake access.\",\n      highlights: [\n        [\"park\",   \"Zilker Park\"],\n        [\"lake\",   \"Barton Springs\"],\n        [\"school\", \"Top-rated schools\"],\n        [\"family\", \"Family-friendly\"]\n      ]\n    },\n    \"travis-heights\": {\n      name: \"Travis Heights\",\n      listings: \"XX\", walk: \"70\", schools: \"A–\",\n      descr: \"Rolling hills just south of Lady Bird Lake — older Austin character with custom-built homes and creek views.\",\n      highlights: [\n        [\"historic\", \"Older Austin charm\"],\n        [\"park\",     \"Creek & trails\"],\n        [\"downtown\", \"Close to downtown\"],\n        [\"quiet\",    \"Quiet streets\"]\n      ]\n    }\n  };\n\n  const $ = (s) => document.querySelector(s);\n  function renderHighlights(items) {\n    const root = $(\"#p-highlights\");\n    root.innerHTML = items.map(([icon, label]) => `\n      <div class=\"hl\">\n        <span class=\"hl-ico\"><svg viewBox=\"0 0 24 24\">${ICONS[icon] || ICONS.new}<\u002Fsvg><\u002Fspan>\n        <span class=\"hl-label\">${label}<\u002Fspan>\n      <\u002Fdiv>\n    `).join(\"\");\n  }\n  function select(id) {\n    const data = NEIGHBORHOODS[id];\n    if (!data) return;\n    document.querySelectorAll(\".n-group\").forEach(g => {\n      const sel = g.dataset.id === id;\n      g.querySelector(\".nhood\").classList.toggle(\"selected\", sel);\n      g.querySelector(\".nhood-label\").classList.toggle(\"selected\", sel);\n    });\n    $(\"#p-name\").textContent = data.name;\n    $(\"#p-cta-name\").textContent = data.name;\n    $(\"#p-listings\").textContent = data.listings;\n    $(\"#p-walk\").textContent = data.walk;\n    $(\"#p-schools\").textContent = data.schools;\n    $(\"#p-descr\").textContent = data.descr;\n    renderHighlights(data.highlights);\n  }\n\n  document.querySelectorAll(\".n-group\").forEach(g => {\n    g.addEventListener(\"click\", () => select(g.dataset.id));\n  });\n\n  // Default selection: Downtown\n  select(\"downtown\");\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
