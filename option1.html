  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x; }\n  html, body { margin: 0; padding: 0; background: var(--page); color: var(--text-primary); font-family: var(--font); }\n  body { min-width: 1440px; }\n  a { color: var(--ice-link); text-decoration: none; }\n  a:hover { text-decoration: underline; }\n  button { font-family: inherit; cursor: pointer; }\n\n  /* ───────────── Top bar ───────────── */\n  .topbar {\n    background: var(--ice-navy);\n    color: var(--text-inverse);\n    height: 72px;\n    display: flex;\n    align-items: stretch;\n    padding: 0 32px;\n    gap: 24px;\n  }\n  .welcome {\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    padding-right: 28px;\n    border-right: 1px solid rgba(255,255,255,.18);\n  }\n  .welcome .hi { font-size: 18px; font-weight: 700; letter-spacing: .1px; }\n  .welcome .last { font-size: 12px; opacity: .75; margin-top: 2px; }\n\n  .topnav {\n    display: flex;\n    align-items: center;\n    gap: 28px;\n    font-size: 15px;\n    font-weight: 600;\n  }\n  .topnav a { color: var(--text-inverse); padding: 6px 2px; }\n  .topnav a.active { border-bottom: 2px solid #fff; padding-bottom: 4px; }\n  .topnav .caret { font-size: 9px; margin-left: 6px; opacity: .85; }\n\n  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }\n  .property-chip {\n    background: var(--ice-navy-deep);\n    border: 1px solid rgba(255,255,255,.12);\n    border-radius: 4px;\n    padding: 10px 18px;\n    font-size: 14px;\n    font-weight: 600;\n    letter-spacing: .2px;\n    display: flex;\n    align-items: center;\n    gap: 8px;\n  }\n  .property-chip .orig { font-weight: 400; opacity: .85; }\n  .star-btn {\n    background: var(--ice-navy-deep);\n    border: 1px solid rgba(255,255,255,.12);\n    border-radius: 4px;\n    padding: 10px 12px;\n    color: #fff;\n    display: inline-flex; align-items: center; gap: 6px;\n    font-size: 13px;\n  }\n  .star-btn svg { width: 16px; height: 16px; fill: #fff; }\n\n  /* ───────────── Summary tiles row ───────────── */\n  .summary {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 16px;\n    padding: 20px 32px 8px;\n  }\n  .tile {\n    background: var(--card);\n    border: 1px solid var(--border);\n    border-radius: 4px;\n    padding: 18px 20px;\n    display: flex;\n    align-items: center;\n    gap: 16px;\n    min-height: 84px;\n  }\n  .tile .icon-circle {\n    width: 44px; height: 44px;\n    border-radius: 999px;\n    background: #eef3fa;\n    color: var(--ice-navy);\n    display: flex; align-items: center; justify-content: center;\n    flex: 0 0 44px;\n  }\n  .tile .icon-circle svg { width: 22px; height: 22px; stroke: var(--ice-navy); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }\n  .tile .label { font-size: 14px; font-weight: 700; color: var(--text-primary); }\n  .tile .meta { font-size: 12px; color: var(--text-secondary); }\n  .tile .figure { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-top: 2px; }\n  .tile .link { font-size: 13px; color: var(--ice-link); margin-top: 4px; display: inline-block; }\n  .tile .left { display: flex; flex-direction: column; }\n  .tile .right {\n    margin-left: auto;\n    text-align: right;\n    display: flex; flex-direction: column;\n    color: var(--text-secondary);\n    font-size: 12px;\n  }\n  .tile .right .num { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-top: 2px; }\n\n  .tile.active {\n    background: var(--ice-navy);\n    color: var(--text-inverse);\n    border-color: var(--ice-navy);\n  }\n  .tile.active .icon-circle { background: rgba(255,255,255,.12); }\n  .tile.active .icon-circle svg { stroke: #fff; }\n  .tile.active .label, .tile.active .figure, .tile.active .right .num { color: #fff; }\n  .tile.active .meta, .tile.active .right { color: rgba(255,255,255,.78); }\n\n  /* ───────────── Content area ───────────── */\n  .content { padding: 16px 32px 48px; }\n  .crumb { font-size: 11px; letter-spacing: .12em; color: var(--text-secondary); font-weight: 600; padding: 12px 0 10px; border-bottom: 1px solid var(--border); }\n\n  .section-head {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 22px 4px 18px;\n  }\n  .section-head h2 {\n    margin: 0;\n    font-size: 15px;\n    letter-spacing: .14em;\n    font-weight: 700;\n    color: var(--text-primary);\n  }\n  .section-head .chev { width: 18px; height: 18px; color: var(--text-secondary); display: inline-flex; }\n\n  .pair {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 24px;\n    align-items: stretch;\n  }\n\n  .card {\n    background: var(--card);\n    border: 1px solid var(--border);\n    border-radius: 6px;\n    box-shadow: 0 1px 0 rgba(16,24,40,.03);\n    padding: 28px 28px 24px;\n    display: flex;\n    flex-direction: column;\n  }\n\n  /* ── Left: Loan to value ── */\n  .ltv-title {\n    font-size: 19px;\n    font-weight: 700;\n    color: var(--text-primary);\n    padding-bottom: 16px;\n    border-bottom: 1px solid var(--border);\n  }\n  .ltv-newpay {\n    text-align: center;\n    padding: 26px 0 22px;\n  }\n  .ltv-newpay .lbl { font-size: 14px; color: var(--text-primary); margin-bottom: 6px; }\n  .ltv-newpay .num { font-size: 40px; font-weight: 700; letter-spacing: -.5px; color: var(--text-primary); }\n\n  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 28px; }\n  .stat-tile { background: var(--tile-bg); border-radius: 4px; padding: 22px 18px 18px; text-align: center; }\n  .stat-tile .v { font-size: 26px; font-weight: 700; color: var(--text-primary); letter-spacing: -.3px; }\n  .stat-tile .k { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }\n\n  .field-row { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 14px; }\n  .field-hint { font-size: 13px; color: var(--text-primary); margin: 0 0 10px; }\n  .field-label { font-size: 13px; color: var(--text-primary); }\n  .select {\n    height: 42px;\n    border: 1px solid #cdd1d8;\n    border-radius: 4px;\n    background: #fff;\n    padding: 0 38px 0 14px;\n    font-size: 14px;\n    color: var(--text-primary);\n    position: relative;\n    display: flex; align-items: center;\n    appearance: none;\n    width: 100%;\n    cursor: pointer;\n  }\n  .select-wrap { position: relative; }\n  .select-wrap::after {\n    content: \"\";\n    position: absolute;\n    right: 14px; top: 50%;\n    width: 8px; height: 8px;\n    border-right: 2px solid #6e7682;\n    border-bottom: 2px solid #6e7682;\n    transform: translateY(-70%) rotate(45deg);\n    pointer-events: none;\n  }\n  .field-row + .field-hint { margin-top: 20px; }\n\n  .delta {\n    margin-top: 26px;\n    display: flex; align-items: center; justify-content: center; gap: 10px;\n    padding-top: 18px;\n    border-top: 1px dashed var(--border);\n  }\n  .delta .arrow {\n    width: 22px; height: 22px; border-radius: 999px;\n    background: var(--ice-arrow-up);\n    color: #fff;\n    display: inline-flex; align-items: center; justify-content: center;\n    font-size: 14px; font-weight: 800;\n  }\n  .delta .amount { font-size: 22px; font-weight: 700; color: var(--text-primary); }\n  .delta .note { font-size: 14px; color: var(--text-secondary); }\n\n  /* ── Right: KW banner ── */\n  .kw-card {\n    background: var(--ice-navy);\n    color: var(--text-inverse);\n    border: 1px solid var(--ice-navy);\n    border-radius: 6px;\n    padding: 28px 28px 24px;\n    display: flex; flex-direction: column;\n    position: relative;\n    overflow: hidden;\n  }\n  .kw-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }\n  .kw-title { font-size: 22px; font-weight: 700; letter-spacing: -.2px; }\n  .kw-sub { font-size: 13px; opacity: .8; margin-top: 4px; display: flex; align-items: center; gap: 8px; }\n  .kw-sub .kw-mark {\n    background: #c8102e;\n    color: #fff;\n    font-size: 9px;\n    font-weight: 800;\n    letter-spacing: .5px;\n    padding
